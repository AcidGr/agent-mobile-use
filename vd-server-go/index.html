<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虚拟副屏实时监控</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #e6edf3;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        .header {
            flex: 0 0 auto;
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .status-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #58a6ff;
        }
        .controls {
            flex: 0 0 auto;
            width: 100%;
            max-width: 360px;
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        button {
            flex: 1;
            padding: 10px 0;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.75; }
        button:disabled { opacity: 0.5; cursor: default; }
        .btn-stream {
            background: #1f6feb;
            color: #ffffff;
            border-color: #388bfd;
        }
        .btn-stream-active {
            background: #8957e5;
            color: #ffffff;
            border-color: #a371f7;
        }
        .btn-stop {
            background: #b62324;
            color: #ffffff;
            border-color: #da3633;
        }
        .btn-start {
            background: #238636;
            color: #ffffff;
            border-color: #2ea043;
        }
        .screen-box {
            position: relative;
            flex: 1 1 0;
            min-height: 0;
            width: min(90vw, 360px);
            background: #000000;
            border: 2px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        #stream-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            pointer-events: none;
        }
        #empty-tip {
            color: #8b949e;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.6;
        }
        .footer-note {
            flex: 0 0 auto;
            margin-top: 10px;
            font-size: 0.75rem;
            color: #8b949e;
            text-align: center;
        }
        @media (max-height: 520px) {
            body { height: auto; min-height: 100vh; overflow: auto; }
            .screen-box { flex: 0 0 auto; min-height: 240px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div id="status-display" class="status-text">检测状态中...</div>
    </div>

    <div class="controls">
        <button id="btn-stream" class="btn-stream" onclick="toggleStream()">开启视频流</button>
        <button id="btn-toggle" class="btn-stop" onclick="toggleScreen()">关闭副屏</button>
    </div>

    <div class="screen-box">
        <canvas id="stream-canvas"></canvas>
        <div id="empty-tip">副屏未启动</div>
    </div>

    <div class="footer-note">H.264 硬件直通 / WebCodecs 原生硬解 / 零多余常驻功耗</div>

    <script>
        const statusEl = document.getElementById('status-display');
        const canvasEl = document.getElementById('stream-canvas');
        const ctx = canvasEl.getContext('2d');
        const tipEl = document.getElementById('empty-tip');
        const toggleEl = document.getElementById('btn-toggle');
        const streamBtn = document.getElementById('btn-stream');

        let screenState = 'unreachable';
        let toggling = false;
        let isStreaming = false;
        let ws = null;
        let decoder = null;

        function renderToggle() {
            if (screenState === 'running') {
                toggleEl.className = 'btn-stop';
                toggleEl.innerText = '关闭副屏';
                toggleEl.disabled = false;
                streamBtn.disabled = false;
            } else if (screenState === 'stopped') {
                toggleEl.className = 'btn-start';
                toggleEl.innerText = '开启副屏';
                toggleEl.disabled = false;
                streamBtn.disabled = true;
                stopStream();
            } else {
                toggleEl.className = 'btn-start';
                toggleEl.innerText = '服务未连接';
                toggleEl.disabled = true;
                streamBtn.disabled = true;
                stopStream();
            }
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.status === 'running') {
                    const did = data.display_id !== undefined ? data.display_id : data.displayId;
                    if (!isStreaming) {
                        statusEl.innerText = '屏幕状态: 运行中 (Display ' + did + ')';
                        statusEl.style.color = '#7ee787';
                    }
                    screenState = 'running';
                } else {
                    statusEl.innerText = '屏幕状态: 已休眠';
                    statusEl.style.color = '#f85149';
                    canvasEl.style.display = 'none';
                    tipEl.style.display = 'block';
                    tipEl.innerText = '副屏未启动';
                    screenState = 'stopped';
                    stopStream();
                }
            } catch (e) {
                statusEl.innerText = '无法连接服务';
                statusEl.style.color = '#f85149';
                screenState = 'unreachable';
                stopStream();
            }
            renderToggle();
            return screenState;
        }

        function initDecoder() {
            if (decoder) {
                try { decoder.close(); } catch (_) {}
            }
            if (!window.VideoDecoder) {
                alert('当前浏览器未启用 WebCodecs 硬件解码，请使用手机 Chrome/Edge 并直接访问 http://127.0.0.1:3070/');
                return false;
            }
            decoder = new VideoDecoder({
                output: (frame) => {
                    if (canvasEl.width !== frame.displayWidth || canvasEl.height !== frame.displayHeight) {
                        canvasEl.width = frame.displayWidth;
                        canvasEl.height = frame.displayHeight;
                    }
                    ctx.drawImage(frame, 0, 0);
                    frame.close();
                    if (canvasEl.style.display !== 'block') {
                        canvasEl.style.display = 'block';
                        tipEl.style.display = 'none';
                    }
                },
                error: (e) => {
                    console.error('VideoDecoder error:', e);
                }
            });
            decoder.configure({
                codec: 'avc1.42E01E',
                optimizeForLatency: true
            });
            return true;
        }

        function startStream() {
            if (isStreaming || screenState !== 'running') return;
            if (!initDecoder()) return;

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/api/stream/ws`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                isStreaming = true;
                streamBtn.innerText = '暂停视频流';
                streamBtn.className = 'btn-stream-active';
                statusEl.innerText = '视频流运行中 (H.264 硬件直通)';
                statusEl.style.color = '#a371f7';
            };

            ws.onmessage = (event) => {
                if (!decoder || decoder.state !== 'configured') return;
                const raw = new Uint8Array(event.data);
                if (raw.length < 2) return;
                const isKey = raw[0] === 1;
                const chunkData = raw.subarray(1);

                try {
                    const chunk = new EncodedVideoChunk({
                        type: isKey ? 'key' : 'delta',
                        timestamp: performance.now() * 1000,
                        data: chunkData
                    });
                    decoder.decode(chunk);
                } catch (err) {
                    console.error('Decode chunk error:', err);
                }
            };

            ws.onclose = ws.onerror = () => {
                stopStream();
            };
        }

        function stopStream() {
            if (ws) {
                try { ws.close(); } catch (_) {}
                ws = null;
            }
            if (decoder) {
                try { decoder.close(); } catch (_) {}
                decoder = null;
            }
            isStreaming = false;
            streamBtn.innerText = '开启视频流';
            streamBtn.className = 'btn-stream';
            if (screenState === 'running') {
                statusEl.innerText = '视频流已暂停';
                statusEl.style.color = '#7ee787';
            }
        }

        function toggleStream() {
            if (isStreaming) {
                stopStream();
            } else {
                startStream();
            }
        }

        async function toggleScreen() {
            if (toggling || screenState === 'unreachable') return;
            toggling = true;
            toggleEl.disabled = true;

            const wasRunning = screenState === 'running';
            toggleEl.innerText = wasRunning ? '正在关闭...' : '正在开启...';
            try {
                await fetch(wasRunning ? '/api/stop' : '/api/start', { method: 'POST' });
            } catch (e) {}

            toggling = false;
            const state = await updateStatus();
            if (state === 'running') {
                startStream();
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isStreaming) {
                stopStream();
            }
        });
        window.addEventListener('beforeunload', () => {
            stopStream();
        });

        updateStatus().then(state => {
            if (state === 'running') {
                startStream();
            }
        });
    </script>
</body>
</html>
