<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>虚拟副屏实时监控</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #000000;
            overflow: hidden;
            position: relative;
        }
        .screen-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        #stream-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            pointer-events: none;
        }
        #empty-tip {
            color: #484f58;
            font-size: 0.95rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* AI 全息只读动效层 */
        .ai-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .ai-layer.active {
            opacity: 1;
            animation: layer-tremor 5.5s infinite;
        }

        /* 周期性轻微全息微震颤 (Tremor) */
        @keyframes layer-tremor {
            0%, 91%, 100% {
                transform: translate3d(0, 0, 0);
                filter: none;
            }
            92% {
                transform: translate3d(-1.5px, 1.2px, 0);
                filter: drop-shadow(0 0 10px rgba(56, 139, 253, 0.45));
            }
            93% {
                transform: translate3d(1.5px, -1.2px, 0);
                filter: drop-shadow(0 0 12px rgba(163, 113, 247, 0.5));
            }
            94% {
                transform: translate3d(-0.8px, 0.6px, 0);
                filter: drop-shadow(0 0 6px rgba(56, 139, 253, 0.35));
            }
            95% {
                transform: translate3d(0.5px, -0.4px, 0);
                filter: none;
            }
            96% {
                transform: translate3d(0, 0, 0);
            }
        }

        /* 同心扩散涟漪能量环 (Ripple Shockwave) */
        .ripple-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            margin-left: -75px;
            margin-top: -75px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            border: 2px solid rgba(88, 166, 255, 0.75);
            box-shadow: 0 0 30px rgba(56, 139, 253, 0.55), inset 0 0 20px rgba(137, 87, 229, 0.4);
        }
        .ai-layer.active .wave-1 {
            animation: ripple-shockwave 5.5s cubic-bezier(0.1, 0.75, 0.15, 1) infinite;
        }
        .ai-layer.active .wave-2 {
            animation: ripple-shockwave 5.5s cubic-bezier(0.1, 0.75, 0.15, 1) 0.35s infinite;
        }
        @keyframes ripple-shockwave {
            0%, 91% {
                transform: scale(0.08);
                opacity: 0;
                filter: blur(0px);
            }
            92% {
                opacity: 0.95;
                filter: blur(0.5px);
            }
            95% {
                opacity: 0.6;
            }
            100% {
                transform: scale(11);
                opacity: 0;
                filter: blur(8px);
            }
        }

        /* 顶部只读状态胶囊 */
        .ai-badge {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 22px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 5px 14px;
            border-radius: 20px;
            background: rgba(13, 17, 23, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(88, 166, 255, 0.22);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 12px rgba(56, 139, 253, 0.12);
            color: #c9d1d9;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.6px;
            pointer-events: none;
            user-select: none;
        }
        .ai-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #58a6ff;
            box-shadow: 0 0 8px #58a6ff;
            animation: ai-pulse 2s ease-in-out infinite;
        }
        @keyframes ai-pulse {
            0%, 100% { opacity: 0.45; transform: scale(0.85); box-shadow: 0 0 4px #58a6ff; }
            50% { opacity: 1; transform: scale(1.18); box-shadow: 0 0 10px #58a6ff, 0 0 16px rgba(88, 166, 255, 0.6); }
        }

        .controls {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            pointer-events: auto;
        }
        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: transparent !important;
            border: none !important;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-icon svg {
            width: 26px;
            height: 26px;
            transition: transform 0.2s ease, filter 0.25s ease, color 0.25s ease;
        }
        .btn-icon:hover:not(:disabled) svg {
            transform: scale(1.15);
        }
        .btn-icon:active:not(:disabled) svg {
            transform: scale(0.9);
        }
        .btn-icon:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 暗着 (Off / Inactive) 极简低调暗色 */
        .btn-stream-off,
        .btn-audio-off,
        .btn-screen-off {
            color: rgba(255, 255, 255, 0.28);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }
        .btn-stream-off:hover:not(:disabled),
        .btn-audio-off:hover:not(:disabled),
        .btn-screen-off:hover:not(:disabled) {
            color: rgba(255, 255, 255, 0.6);
        }

        /* 亮着 (On / Active) 鲜亮发光效果 */
        /* 1. 视频流胶卷按钮开启态: 极光紫蓝荧光 */
        .btn-stream-on {
            color: #a371f7;
            filter: drop-shadow(0 0 10px rgba(163, 113, 247, 0.9)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        /* 2. 静音喇叭按钮开启态: 暖金警示荧光 */
        .btn-audio-on {
            color: #e3b341;
            filter: drop-shadow(0 0 10px rgba(227, 179, 65, 0.9)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }
        .btn-audio-on .icon-mute-x { display: inline; }
        .btn-audio-on .icon-sound-waves { display: none; }
        .btn-audio-off .icon-mute-x { display: none; }
        .btn-audio-off .icon-sound-waves { display: inline; }

        /* 3. 电源开关按钮开启态: 翡翠鲜活荧光 */
        .btn-screen-on {
            color: #3fb950;
            filter: drop-shadow(0 0 10px rgba(63, 185, 80, 0.95)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }
    </style>
</head>
<body>
    <div class="screen-box">
        <canvas id="stream-canvas"></canvas>
        <div id="empty-tip">副屏未启动</div>
        <div id="ai-layer" class="ai-layer">
            <div class="ripple-ring wave-1"></div>
            <div class="ripple-ring wave-2"></div>
            <div class="ai-badge">
                <span class="ai-dot"></span>
                <span class="ai-label">AI 操控中 · 只读全息</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-stream" class="btn-icon btn-stream-off" onclick="toggleStream()" title="开启/暂停视频流">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                <rect x="2" y="3.5" width="20" height="17" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                <line x1="2" y1="7.5" x2="22" y2="7.5" stroke="currentColor" stroke-width="1.4"/>
                <line x1="2" y1="16.5" x2="22" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
                <rect x="4.2" y="4.8" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="8.9" y="4.8" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="13.6" y="4.8" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="18.3" y="4.8" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="4.2" y="17.7" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="8.9" y="17.7" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="13.6" y="17.7" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="18.3" y="17.7" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <polygon points="10.5,9.8 15.5,12 10.5,14.2" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
        </button>
        <button id="btn-audio" class="btn-icon btn-audio-on" onclick="toggleAudioMute()" title="副屏静音: 开 (点击切换 / 双击一键全解)">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"/>
                <g class="icon-mute-x">
                    <line x1="21" y1="10" x2="16" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="16" y1="10" x2="21" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </g>
                <g class="icon-sound-waves">
                    <path d="M15.5 9a4.5 4.5 0 0 1 0 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M18.8 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </g>
            </svg>
        </button>
        <button id="btn-toggle" class="btn-icon btn-screen-on" onclick="toggleScreen()" title="开启/关闭副屏">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="12" y1="2" x2="12" y2="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <script>
        const canvasEl = document.getElementById('stream-canvas');
        const ctx = canvasEl.getContext('2d');
        const tipEl = document.getElementById('empty-tip');
        const aiLayer = document.getElementById('ai-layer');
        const toggleEl = document.getElementById('btn-toggle');
        const streamBtn = document.getElementById('btn-stream');
        const audioBtn = document.getElementById('btn-audio');

        let screenState = 'unreachable';
        let toggling = false;
        let isStreaming = false;
        let audioMuteEnabled = true;
        let ws = null;
        let decoder = null;

        async function fetchAudioStatus() {
            try {
                const res = await fetch('/api/audio/status');
                if (res.ok) {
                    const data = await res.json();
                    audioMuteEnabled = data.enabled;
                    updateAudioBtn();
                }
            } catch (e) {}
        }

        function updateAudioBtn() {
            if (!audioBtn) return;
            if (audioMuteEnabled) {
                audioBtn.className = 'btn-icon btn-audio-on';
                audioBtn.title = '副屏静音: 开 (点击切换 / 双击一键全解)';
            } else {
                audioBtn.className = 'btn-icon btn-audio-off';
                audioBtn.title = '副屏静音: 关 (点击切换 / 双击一键全解)';
            }
        }

        async function toggleAudioMute() {
            try {
                const res = await fetch('/api/audio/toggle', { method: 'POST', body: JSON.stringify({ enabled: !audioMuteEnabled }) });
                if (res.ok) {
                    const data = await res.json();
                    audioMuteEnabled = data.enabled;
                    updateAudioBtn();
                }
            } catch (e) {}
        }

        if (audioBtn) {
            audioBtn.addEventListener('dblclick', async (e) => {
                e.preventDefault();
                try {
                    await fetch('/api/audio/unmute-all', { method: 'POST' });
                    audioMuteEnabled = false;
                    updateAudioBtn();
                    alert('已强制恢复所有应用声音');
                } catch (e) {}
            });
        }

        function renderToggle() {
            if (screenState === 'running') {
                toggleEl.className = 'btn-icon btn-screen-on';
                toggleEl.title = '副屏运行中 (点击关闭)';
                toggleEl.disabled = false;
                streamBtn.disabled = false;
            } else if (screenState === 'stopped') {
                toggleEl.className = 'btn-icon btn-screen-off';
                toggleEl.title = '副屏已休眠 (点击开启)';
                toggleEl.disabled = false;
                streamBtn.disabled = true;
                stopStream();
            } else {
                toggleEl.className = 'btn-icon btn-screen-off';
                toggleEl.title = '服务未连接';
                toggleEl.disabled = true;
                streamBtn.disabled = true;
                stopStream();
            }
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.status === 'running') {
                    screenState = 'running';
                    if (aiLayer) aiLayer.classList.add('active');
                } else {
                    canvasEl.style.display = 'none';
                    tipEl.style.display = 'block';
                    tipEl.innerText = '副屏未启动';
                    screenState = 'stopped';
                    if (aiLayer) aiLayer.classList.remove('active');
                    stopStream();
                }
            } catch (e) {
                tipEl.style.display = 'block';
                tipEl.innerText = '无法连接服务';
                screenState = 'unreachable';
                if (aiLayer) aiLayer.classList.remove('active');
                stopStream();
            }
            renderToggle();
            fetchAudioStatus();
            return screenState;
        }

        function initDecoder() {
            if (decoder) {
                try { decoder.close(); } catch (_) {}
            }
            if (!window.VideoDecoder) {
                alert('当前浏览器未启用 WebCodecs 硬件解码，请使用手机 Chrome/Edge 并直接访问 http://127.0.0.1:3070/');
                return false;
            }
            decoder = new VideoDecoder({
                output: (frame) => {
                    if (canvasEl.width !== frame.displayWidth || canvasEl.height !== frame.displayHeight) {
                        canvasEl.width = frame.displayWidth;
                        canvasEl.height = frame.displayHeight;
                    }
                    ctx.drawImage(frame, 0, 0);
                    frame.close();
                    if (canvasEl.style.display !== 'block') {
                        canvasEl.style.display = 'block';
                        tipEl.style.display = 'none';
                    }
                },
                error: (e) => {
                    console.error('VideoDecoder error:', e);
                }
            });
            decoder.configure({
                codec: 'avc1.42E01E',
                optimizeForLatency: true
            });
            return true;
        }

        function startStream() {
            if (isStreaming || screenState !== 'running') return;
            if (!initDecoder()) return;

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/api/stream/ws`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                isStreaming = true;
                streamBtn.className = 'btn-icon btn-stream-on';
                streamBtn.title = '视频流运行中 (点击暂停)';
            };

            ws.onmessage = (event) => {
                if (!decoder || decoder.state !== 'configured') return;
                const raw = new Uint8Array(event.data);
                if (raw.length < 2) return;
                const isKey = raw[0] === 1;
                const chunkData = raw.subarray(1);

                try {
                    const chunk = new EncodedVideoChunk({
                        type: isKey ? 'key' : 'delta',
                        timestamp: performance.now() * 1000,
                        data: chunkData
                    });
                    decoder.decode(chunk);
                } catch (err) {
                    console.error('Decode chunk error:', err);
                }
            };

            ws.onclose = ws.onerror = () => {
                stopStream();
            };
        }

        function stopStream() {
            if (ws) {
                try { ws.close(); } catch (_) {}
                ws = null;
            }
            if (decoder) {
                try { decoder.close(); } catch (_) {}
                decoder = null;
            }
            isStreaming = false;
            streamBtn.className = 'btn-icon btn-stream-off';
            streamBtn.title = '视频流已暂停 (点击开启)';
        }

        function toggleStream() {
            if (isStreaming) {
                stopStream();
            } else {
                startStream();
            }
        }

        async function toggleScreen() {
            if (toggling || screenState === 'unreachable') return;
            toggling = true;
            toggleEl.disabled = true;

            const wasRunning = screenState === 'running';
            toggleEl.title = wasRunning ? '正在关闭副屏...' : '正在开启副屏...';
            try {
                await fetch(wasRunning ? '/api/stop' : '/api/start', { method: 'POST' });
            } catch (e) {}

            toggling = false;
            const state = await updateStatus();
            if (state === 'running') {
                startStream();
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isStreaming) {
                stopStream();
            }
        });
        window.addEventListener('beforeunload', () => {
            stopStream();
        });

        updateStatus().then(state => {
            if (state === 'running') {
                startStream();
            }
        });
    </script>
</body>
</html>
