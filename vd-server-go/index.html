<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>虚拟副屏实时监控</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: #000000;
            overflow: hidden;
            position: relative;
        }
        .screen-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        #stream-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            pointer-events: none;
        }
        #empty-tip {
            color: #484f58;
            font-size: 0.95rem;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .controls {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            pointer-events: auto;
        }
        .btn-icon {
            width: 44px;
            height: 44px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: transparent !important;
            border: none !important;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-icon svg {
            width: 26px;
            height: 26px;
            transition: transform 0.2s ease, filter 0.25s ease, color 0.25s ease;
        }
        .btn-icon:hover:not(:disabled) svg {
            transform: scale(1.15);
        }
        .btn-icon:active:not(:disabled) svg {
            transform: scale(0.9);
        }
        .btn-icon:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 暗着 (Off / Inactive) 极简低调暗色 */
        .btn-stream-off,
        .btn-audio-off,
        .btn-screen-off {
            color: rgba(255, 255, 255, 0.28);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }
        .btn-stream-off:hover:not(:disabled),
        .btn-audio-off:hover:not(:disabled),
        .btn-screen-off:hover:not(:disabled) {
            color: rgba(255, 255, 255, 0.6);
        }

        /* 亮着 (On / Active) 鲜亮发光效果 */
        /* 1. 视频流胶卷按钮开启态: 极光紫蓝荧光 */
        .btn-stream-on {
            color: #a371f7;
            filter: drop-shadow(0 0 10px rgba(163, 113, 247, 0.9)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        /* 2. 静音喇叭按钮开启态: 暖金警示荧光 */
        .btn-audio-on {
            color: #e3b341;
            filter: drop-shadow(0 0 10px rgba(227, 179, 65, 0.9)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }
        .btn-audio-on .icon-mute-x { display: inline; }
        .btn-audio-on .icon-sound-waves { display: none; }
        .btn-audio-off .icon-mute-x { display: none; }
        .btn-audio-off .icon-sound-waves { display: inline; }

        /* 3. 电源开关按钮开启态: 翡翠鲜活荧光 */
        .btn-screen-on {
            color: #3fb950;
            filter: drop-shadow(0 0 10px rgba(63, 185, 80, 0.95)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }
    </style>
</head>
<body>
    <div class="screen-box">
        <canvas id="stream-canvas"></canvas>
        <div id="empty-tip">副屏未启动</div>
    </div>

    <div class="controls">
        <button id="btn-stream" class="btn-icon btn-stream-off" onclick="toggleStream()" title="开启/暂停视频流">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                <rect x="2" y="3.5" width="20" height="17" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                <line x1="2" y1="7.5" x2="22" y2="7.5" stroke="currentColor" stroke-width="1.4"/>
                <line x1="2" y1="16.5" x2="22" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
                <rect x="4.2" y="4.8" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="8.9" y="4.8" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="13.6" y="4.8" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="18.3" y="4.8" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="4.2" y="17.7" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="8.9" y="17.7" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="13.6" y="17.7" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <rect x="18.3" y="17.7" width="2.2" height="1.5" rx="0.4" fill="currentColor"/>
                <polygon points="10.5,9.8 15.5,12 10.5,14.2" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
        </button>
        <button id="btn-audio" class="btn-icon btn-audio-on" onclick="toggleAudioMute()" title="副屏静音: 开 (点击切换 / 双击一键全解)">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"/>
                <g class="icon-mute-x">
                    <line x1="21" y1="10" x2="16" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="16" y1="10" x2="21" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </g>
                <g class="icon-sound-waves">
                    <path d="M15.5 9a4.5 4.5 0 0 1 0 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M18.8 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </g>
            </svg>
        </button>
        <button id="btn-toggle" class="btn-icon btn-screen-on" onclick="toggleScreen()" title="开启/关闭副屏">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="12" y1="2" x2="12" y2="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <script>
        const canvasEl = document.getElementById('stream-canvas');
        const ctx = canvasEl.getContext('2d');
        const tipEl = document.getElementById('empty-tip');
        const toggleEl = document.getElementById('btn-toggle');
        const streamBtn = document.getElementById('btn-stream');
        const audioBtn = document.getElementById('btn-audio');

        let screenState = 'unreachable';
        let toggling = false;
        let isStreaming = false;
        let audioMuteEnabled = true;
        let ws = null;
        let decoder = null;

        // Distinguishes a deliberate stop (user pressed pause, page unloading) from an
        // unexpected drop. Only unexpected drops auto-reconnect.
        let userStopped = false;
        let reconnectTimer = null;
        let reconnectDelay = 500;
        const MAX_RECONNECT_DELAY = 5000;
        let decoderUnsupported = false;

        async function fetchAudioStatus() {
            try {
                const res = await fetch('/api/audio/status');
                if (res.ok) {
                    const data = await res.json();
                    audioMuteEnabled = data.enabled;
                    updateAudioBtn();
                }
            } catch (e) {}
        }

        function updateAudioBtn() {
            if (!audioBtn) return;
            if (audioMuteEnabled) {
                audioBtn.className = 'btn-icon btn-audio-on';
                audioBtn.title = '副屏静音: 开 (点击切换 / 双击一键全解)';
            } else {
                audioBtn.className = 'btn-icon btn-audio-off';
                audioBtn.title = '副屏静音: 关 (点击切换 / 双击一键全解)';
            }
        }

        async function toggleAudioMute() {
            try {
                const res = await fetch('/api/audio/toggle', { method: 'POST', body: JSON.stringify({ enabled: !audioMuteEnabled }) });
                if (res.ok) {
                    const data = await res.json();
                    audioMuteEnabled = data.enabled;
                    updateAudioBtn();
                }
            } catch (e) {}
        }

        if (audioBtn) {
            audioBtn.addEventListener('dblclick', async (e) => {
                e.preventDefault();
                try {
                    await fetch('/api/audio/unmute-all', { method: 'POST' });
                    audioMuteEnabled = false;
                    updateAudioBtn();
                    alert('已强制恢复所有应用声音');
                } catch (e) {}
            });
        }

        function renderToggle() {
            // Pure presentation: never stop the stream here. Stream lifecycle is owned by
            // updateStatus/startStream/stopStream so a redraw can't kill a live stream.
            if (screenState === 'running') {
                toggleEl.className = 'btn-icon btn-screen-on';
                toggleEl.title = '副屏运行中 (点击关闭)';
                toggleEl.disabled = false;
                streamBtn.disabled = false;
            } else if (screenState === 'stopped') {
                toggleEl.className = 'btn-icon btn-screen-off';
                toggleEl.title = '副屏已休眠 (点击开启)';
                toggleEl.disabled = false;
                streamBtn.disabled = true;
            } else {
                toggleEl.className = 'btn-icon btn-screen-off';
                toggleEl.title = '服务未连接';
                toggleEl.disabled = true;
                streamBtn.disabled = true;
            }
        }

        function showTip(text) {
            canvasEl.style.display = 'none';
            tipEl.style.display = 'block';
            tipEl.innerText = text;
        }

        // A single failed /api/status probe is not proof the screen went away: the daemon
        // may still be coming up right after /api/start. Probe a few times before declaring
        // the screen stopped, which is the terminal state that used to kill the stream.
        async function probeStatus(attempts = 3, delayMs = 400) {
            let lastErr = null;
            for (let i = 0; i < attempts; i++) {
                try {
                    const res = await fetch('/api/status', { cache: 'no-store' });
                    const data = await res.json();
                    if (data.status === 'running') return { ok: true, running: true };
                    if (data.status === 'failed') return { ok: true, running: false, failed: true };
                    lastErr = null;
                } catch (e) {
                    lastErr = e;
                }
                if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs));
            }
            if (lastErr) return { ok: false };
            return { ok: true, running: false };
        }

        async function updateStatus() {
            const result = await probeStatus();
            if (!result.ok) {
                showTip('无法连接服务');
                screenState = 'unreachable';
                stopStream(true);
            } else if (result.running) {
                screenState = 'running';
            } else {
                showTip(result.failed ? '副屏启动失败' : '副屏未启动');
                screenState = 'stopped';
                stopStream(true);
            }
            renderToggle();
            fetchAudioStatus();
            return screenState;
        }

        function initDecoder() {
            if (decoder) {
                try { decoder.close(); } catch (_) {}
                decoder = null;
            }
            if (!window.VideoDecoder) {
                decoderUnsupported = true;
                showTip('当前浏览器未启用 WebCodecs 硬件解码，请使用手机 Chrome/Edge 访问');
                return false;
            }
            decoderUnsupported = false;
            decoder = new VideoDecoder({
                output: (frame) => {
                    if (canvasEl.width !== frame.displayWidth || canvasEl.height !== frame.displayHeight) {
                        canvasEl.width = frame.displayWidth;
                        canvasEl.height = frame.displayHeight;
                    }
                    ctx.drawImage(frame, 0, 0);
                    frame.close();
                    if (canvasEl.style.display !== 'block') {
                        canvasEl.style.display = 'block';
                        tipEl.style.display = 'none';
                    }
                },
                error: (e) => {
                    console.error('VideoDecoder error:', e);
                }
            });
            decoder.configure({
                codec: 'avc1.42E01E',
                optimizeForLatency: true
            });
            return true;
        }

        function clearReconnect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
        }

        function scheduleReconnect() {
            if (userStopped || screenState !== 'running' || decoderUnsupported) return;
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                if (userStopped || screenState !== 'running') return;
                reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY);
                startStream(true);
            }, reconnectDelay);
        }

        function startStream(isRetry) {
            if (isStreaming) return;
            clearReconnect();
            if (!isRetry) { userStopped = false; }
            if (screenState !== 'running') return;
            if (!initDecoder()) return;

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            let sock;
            try {
                sock = new WebSocket(`${protocol}//${location.host}/api/stream/ws`);
            } catch (e) {
                scheduleReconnect();
                return;
            }
            ws = sock;
            sock.binaryType = 'arraybuffer';

            sock.onopen = () => {
                if (ws !== sock) return;
                isStreaming = true;
                reconnectDelay = 500;
                streamBtn.className = 'btn-icon btn-stream-on';
                streamBtn.title = '视频流运行中 (点击暂停)';
            };

            sock.onmessage = (event) => {
                if (ws !== sock) return;
                if (!decoder || decoder.state !== 'configured') return;
                const raw = new Uint8Array(event.data);
                if (raw.length < 2) return;
                const isKey = raw[0] === 1;
                const chunkData = raw.subarray(1);

                try {
                    const chunk = new EncodedVideoChunk({
                        type: isKey ? 'key' : 'delta',
                        timestamp: performance.now() * 1000,
                        data: chunkData
                    });
                    decoder.decode(chunk);
                } catch (err) {
                    console.error('Decode chunk error:', err);
                }
            };

            sock.onclose = sock.onerror = () => {
                if (ws !== sock) return;
                // Unexpected drop (network blip, encoder restart, gateway reconnect):
                // release this socket but keep the user's intent to watch, then retry.
                teardownSocket();
                if (!userStopped && screenState === 'running') {
                    scheduleReconnect();
                }
            };
        }

        // Release the socket + decoder without touching userStopped. Used by the reconnect
        // path, which must survive the teardown.
        function teardownSocket() {
            if (ws) {
                try { ws.close(); } catch (_) {}
                ws = null;
            }
            if (decoder) {
                try { decoder.close(); } catch (_) {}
                decoder = null;
            }
            isStreaming = false;
            streamBtn.className = 'btn-icon btn-stream-off';
            streamBtn.title = '视频流已暂停 (点击开启)';
        }

        // stopStream(userInitiated=true) marks a deliberate stop so no auto-reconnect fires.
        function stopStream(userInitiated) {
            if (userInitiated) {
                userStopped = true;
            }
            if (userInitiated) clearReconnect();
            teardownSocket();
        }

        function toggleStream() {
            if (isStreaming) {
                stopStream(true);
            } else {
                startStream(false);
            }
        }

        async function toggleScreen() {
            if (toggling || screenState === 'unreachable') return;
            toggling = true;
            toggleEl.disabled = true;

            const wasRunning = screenState === 'running';
            toggleEl.title = wasRunning ? '正在关闭副屏...' : '正在开启副屏...';
            try {
                await fetch(wasRunning ? '/api/stop' : '/api/start', { method: 'POST' });
            } catch (e) {}

            toggling = false;
            const state = await updateStatus();
            if (state === 'running') {
                startStream(false);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Hidden: release the encoder to save power. stopStream(false) keeps
                // userStopped untouched, so the visible branch below can resume.
                if (isStreaming && !userStopped) {
                    stopStream(false);
                }
            } else if (!userStopped && screenState === 'running' && !isStreaming) {
                // Visible again: restore the stream that the hidden-state teardown paused.
                startStream(true);
            }
        });
        window.addEventListener('beforeunload', () => {
            stopStream(true);
        });

        updateStatus().then(state => {
            if (state === 'running') {
                startStream(false);
            }
        });
    </script>
</body>
</html>
