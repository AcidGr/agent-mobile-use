<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虚拟副屏快照监控</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        /* The page never scrolls: the header/controls/footer keep their intrinsic
           height and the snapshot box absorbs whatever vertical space is left, so
           the phone frame always fits the viewer's browser viewport. Using dvh
           (with a vh fallback) keeps that true while the mobile URL bar hides/shows. */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #e6edf3;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        .header {
            flex: 0 0 auto;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .status-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #58a6ff;
        }
        .controls {
            flex: 0 0 auto;
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        button {
            flex: 1;
            padding: 10px 0;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.75; }
        button:disabled { opacity: 0.5; cursor: default; }
        .btn-refresh {
            background: #238636;
            color: #ffffff;
            border-color: #2ea043;
        }
        .btn-stop {
            background: #b62324;
            color: #ffffff;
            border-color: #da3633;
        }
        .btn-start {
            background: #238636;
            color: #ffffff;
            border-color: #2ea043;
        }
        /* flex-basis 0 (not auto) keeps the box's content-driven size out of the
           flex calculation, so its height is exactly the leftover space and the
           image below can resolve height:100% against a definite box. */
        .screen-box {
            position: relative;
            flex: 1 1 0;
            min-height: 0;
            width: min(90vw, 360px);
            background: #000000;
            border: 2px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }
        #snapshot-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            pointer-events: none;
        }
        #empty-tip {
            color: #8b949e;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.6;
        }
        .footer-note {
            flex: 0 0 auto;
            margin-top: 10px;
            font-size: 0.75rem;
            color: #8b949e;
            text-align: center;
        }
        /* Very short viewports (landscape / split screen): give up the fixed
           layout and let the page scroll, so the buttons can never be squeezed out. */
        @media (max-height: 520px) {
            body { height: auto; min-height: 100vh; overflow: auto; }
            .screen-box { flex: 0 0 auto; min-height: 240px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div id="status-display" class="status-text">检测状态中...</div>
    </div>

    <div class="controls">
        <button class="btn-refresh" onclick="refreshSnapshot()">手动刷新</button>
        <button id="btn-toggle" class="btn-stop" onclick="toggleScreen()">关闭副屏</button>
    </div>

    <div class="screen-box">
        <img id="snapshot-img" alt="副屏快照" />
        <div id="empty-tip">副屏未启动</div>
    </div>

    <div class="footer-note">无自动轮询 / 零后台CPU占用 / 点击手动刷新截取当前画面</div>

    <script>
        const statusEl = document.getElementById('status-display');
        const imgEl = document.getElementById('snapshot-img');
        const tipEl = document.getElementById('empty-tip');
        const toggleEl = document.getElementById('btn-toggle');

        // 'running' | 'stopped' | 'unreachable'
        // `unreachable` must stay distinct from `stopped`: when the gateway is down
        // there is nothing to start, so the toggle is disabled instead of offering
        // an "开启副屏" that could never work.
        let screenState = 'unreachable';
        let toggling = false;

        function renderToggle() {
            if (screenState === 'running') {
                toggleEl.className = 'btn-stop';
                toggleEl.innerText = '关闭副屏';
                toggleEl.disabled = false;
            } else if (screenState === 'stopped') {
                toggleEl.className = 'btn-start';
                toggleEl.innerText = '开启副屏';
                toggleEl.disabled = false;
            } else {
                toggleEl.className = 'btn-start';
                toggleEl.innerText = '服务未连接';
                toggleEl.disabled = true;
            }
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.status === 'running') {
                    const did = data.display_id !== undefined ? data.display_id : data.displayId;
                    statusEl.innerText = '屏幕状态: 运行中 (Display ' + did + ')';
                    statusEl.style.color = '#7ee787';
                    screenState = 'running';
                } else {
                    statusEl.innerText = '屏幕状态: 已休眠';
                    statusEl.style.color = '#f85149';
                    imgEl.style.display = 'none';
                    tipEl.style.display = 'block';
                    tipEl.innerText = '副屏未启动';
                    screenState = 'stopped';
                }
            } catch (e) {
                statusEl.innerText = '无法连接服务';
                statusEl.style.color = '#f85149';
                screenState = 'unreachable';
            }
            renderToggle();
            return screenState;
        }

        async function refreshSnapshot() {
            // /api/screenshot starts the virtual display on demand, so it is only
            // ever called once the status check has confirmed the display is up.
            if (await updateStatus() !== 'running') return;

            statusEl.innerText = '正在截取快照...';
            const img = new Image();
            img.onload = () => {
                imgEl.src = img.src;
                imgEl.style.display = 'block';
                tipEl.style.display = 'none';
                updateStatus();
            };
            img.onerror = () => {
                statusEl.innerText = '获取快照失败';
                statusEl.style.color = '#f85149';
            };
            img.src = '/api/screenshot?t=' + Date.now();
        }

        // start/stop are synchronous on the server (they poll the daemon for up to
        // 3s / 2s before answering), so the button locks out repeat taps while a
        // switch is in flight.
        async function toggleScreen() {
            if (toggling || screenState === 'unreachable') return;
            toggling = true;
            toggleEl.disabled = true;

            const wasRunning = screenState === 'running';
            toggleEl.innerText = wasRunning ? '正在关闭...' : '正在开启...';
            try {
                await fetch(wasRunning ? '/api/stop' : '/api/start', { method: 'POST' });
            } catch (e) {}

            toggling = false;
            const state = await updateStatus();
            if (state === 'running') await refreshSnapshot();
        }

        updateStatus().then(state => {
            if (state === 'running') refreshSnapshot();
        });
    </script>
</body>
</html>
